<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Biorhythm – quick check</title>

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600&display=swap"
        rel="stylesheet">

  <style>
    body{margin:0;font-family:Montserrat,sans-serif;background:#fafafa;
         color:#222;min-height:100vh;display:flex;align-items:center;
         justify-content:center;}
    .card{background:#fff;padding:2rem 1.5rem;border-radius:12px;
           box-shadow:0 8px 20px rgba(0,0,0,.1);width:90%;max-width:400px;}
    .form-row{display:flex;flex-direction:column;gap .8rem;margin-bottom .8rem;}
    .form-row label{font-weight:600;}
    .form-row input{
      padding:.5rem .8rem;border:2px solid #ccc;border-radius .5rem;
      font-size:1rem; width:100%; box-sizing:border-box;}
    .calc-btn{
      width:100%;padding .6rem;background:#0066cc;color:#fff;border:none;
      border-radius .5rem;font-size 1rem;font-weight:600;cursor:pointer;
      margin-top .4rem;}
    .result{margin-top 1.5rem;font-size 1.2rem;}
    .tile{display:inline-block;width:30%;margin .2rem;text-align:center;}
    .tile .pct{font-size 1.8rem;font-weight 700;margin .2rem 0;}
  </style>
</head>
<body>
  <div class="card">
    <h2><i class="fas fa-calculator"></i> Biorhythm</h2>

    <form id="biorhythm-form">
      <div class="form-row">
        <label for="birthdate">Birth date (YYYY‑MM‑DD)</label>
        <input type="text" id="birthdate" placeholder="1990-05-15" required>
      </div>

      <div class="form-row">
        <label for="range">Days to show</label>
        <input type="number" id="range" min="1" value="60">
      </div>

      <button type="submit" class="calc-btn"><i class="fas fa-calculate"></i> GO</button>
    </form>

    <div class="result" id="result"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
