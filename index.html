<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Biorhythm – simple</title>
<link rel="icon" type="image/svg+xml" data="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23d64045'/%3E%3Ctext x='16' y='20' font-family='sans-serif' font-size='12' fill='%23fff' text-anchor='middle'%3EB%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" sizes="180x180" href="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='180' height='180' viewBox='0 0 180 180'%3E%3Ccircle cx='90' cy='90' r='85' fill='%23d64045'/%3E%3Ctext x='90' y='105' font-family='sans-serif' font-size='24' fill='%23fff' text-anchor='middle'%3EB%3C/text%3E%3C/svg%3E">
<style>
  body{font-family:sans-serif;max-width:600px;margin:2rem auto;line-height:1.5;background:#fafafa;color:#111;}
  .card{background:#fff;padding:2rem;border:1px solid #ddd;border-radius:8px;box-shadow:0 2px 4px rgba(0,0,0,.1);}
  button.moon{position:absolute;top:1rem;right:1rem;background:none;border:none;color:#666;font-size:1.2rem;cursor:pointer;aria-label="Toggle dark mode";}
  h1{margin:0 .5rem 0;}
  form{margin-top:1rem;}
  input{width:100%;padding:.5rem;border:1px solid #ddd;border-radius:.4rem;margin:.5rem 0;}
  button{padding:.5rem 1rem;margin-top:1rem;}
  footer{margin-top:2rem;text-align:center;color:#666;font-size:.9rem;}
  .version{font-size:.8rem;color:#999;margin-top:1rem;}
</style>
</head>
<body>
<header>
<h1>Biorhythm</h1>
<button class="moon" aria-label="Toggle dark mode">🌙</button>
</header>
<div class="card">
<form id="bform">
<label>Birth date: <input type="date" id="birth" required></label><br><br>
<label>Days to show: <input type="number" id="range" min="1" value="90"></label><br><br>
<button type="submit">Go</button>
</form>
<p id="result" class="version"></p>
</div>
<footer>&copy; 2026 biorhythm – entertainment only</footer>

<script>
(function(){
  const html = document.documentElement;
  const moon = document.querySelector('.moon');
  if(window.matchMedia('(prefers-color-scheme: dark)').matches) html.classList.add('dark');
  if(moon) moon.addEventListener('click',()=>{ html.classList.toggle('dark'); localStorage.setItem('theme',html.classList.contains('dark')?'dark':'light'); });
})();
</script>
<script>
function daysSinceBirth(bd){const today=new Date();const birth=new Date(bd);return Math.floor(Math.abs(today-birth)/(1000*60*60*24));}
function sinCycle(days,per){return Math.sin(2*Math.PI*days/per);}
function computeCycles(bd,range){const offset=daysSinceBirth(bd);const data=[];for(let i=-range;i<=range;i++){data.push({day:offset+i,physical:sinCycle(offset+i,23),emotional:sinCycle(offset+i,28),intellectual:sinCycle(offset+i,33)});}return data;}
function pct(v){return Math.round(((v+1)/2)*100);}
document.getElementById('bform').addEventListener('submit',function(e){e.preventDefault();const birth=document.getElementById('birth').value;const range=document.getElementById('range').value||90;if(!birth){alert('Enter a birth date');return;}const cycles=computeCycles(birth,range);const today=cycles.find(d=>d.day===0)||cycles[0];const pPhysical=pct(today.physical),pEmotional=pct(today.emotional),pIntellectual=pct(today.intellectual);document.getElementById('result').textContent=`Physical ${pPhysical}% Emotional ${pEmotional}% Intellectual ${pIntellectual}%`;});
</script>
</body>
</html>
