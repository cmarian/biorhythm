<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Biorhythm</title>

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap"
        rel="stylesheet">

  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0"></script>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="card">
    <header class="card-header">
      <h1><i class="fas fa-gem"></i> Biorhythm</h1>
      <p class="card-sub">Physical • Emotional • Intellectual</p>
    </header>

    <section class="card-body">
      <form id="biorhythm-form">
        <div class="form-row">
          <div class="form-group">
            <label for="birthdate"><i class="fas fa-calendar-alt"></i> Birth date</label>
            <!--  Native date picker – now guaranteed to be visible  -->
            <input type="date"
                   id="birthdate"
                   required
                   style="width:100%;padding:.6rem .8rem;border:2px solid #dfe6e9;
                          border-radius:10px;background:#fafafa;color:#2c3e50;
                          font-family:inherit;font-size:1rem;outline:none;
                          z-index:1;appearance:none;">
          </div>

          <div class="form-group">
            <label for="range"><i class="fas fa-slider"></i> Days to show</label>
            <input type="number" id="range" min="1" value="90">
          </div>
        </div>

        <button type="submit" class="calc-btn"><i class="fas fa-calculate"></i> GO</button>
      </form>
    </section>

    <div id="result" class="result-tiles"></div>

    <section class="chart-wrapper">
      <canvas id="biorhythmChart"></canvas>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
