<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Biorhythm – simple</title>
<style>
  body{font-family:sans-serif;max-width:600px;margin:2rem auto;line-height:1.5;}
  .card{background:#fff;padding:2rem;border:1px solid #ddd;border-radius:8px;box-shadow:0 2px 4px rgba(0,0,0,.1);}
  button{margin-top:1rem;padding:.5rem 1rem;}
</style>
</head>
<body>
<div class="card">
  <h1>Biorhythm</h1>
  <form id="bform">
    <label>Birth date: <input type="date" id="birth" required></label><br><br>
    <label>Days to show: <input type="number" id="range" min="1" value="90"></label><br><br>
    <button type="submit">Go</button>
  </form>
  <p id="result"></p>
</div>
<footer style="margin-top:2rem;text-align:center;color:#666;font-size:.9rem;">
  &copy; 2026 biorhythm – entertainment only
</footer>

<script>
function daysSinceBirth(birthDate){
  const today=new Date();
  const birth=new Date(birthDate);
  return Math.floor(Math.abs(today-birth)/(1000*60*60*24));
}
function sinCycle(days,period){return Math.sin(2*Math.PI*days/period);}
function computeCycles(birthDate,rangeDays){
  const offset=daysSinceBirth(birthDate);
  const data=[];
  for(let i=-rangeDays;i<=rangeDays;i++){
    data.push({
      day:offset+i,
      physical:sinCycle(offset+i,23),
      emotional:sinCycle(offset+i,28),
      intellectual:sinCycle(offset+i,33)
    });
  }
  return data;
}
function pct(value){return Math.round(((value+1)/2)*100);}

document.getElementById('bform').addEventListener('submit',function(e){
  e.preventDefault();
  const birth=document.getElementById('birth').value;
  const range=document.getElementById('range').value||90;
  if(!birth){alert('Enter a birth date');return;}
  const cycles=computeCycles(birth,range);
  const today=cycles.find(d=>d.day===0)||cycles[0];
  const pPhysical=pct(today.physical);
  const pEmotional=pct(today.emotional);
  const pIntellectual=pct(today.intellectual);
  document.getElementById('result').textContent=
    'Physical '+pPhysical+'% Emotional '+pEmotional+'% Intellectual '+pIntellectual+'%';
});
</script>
</body>
</html>
