<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Biorhythm – simple</title>
<!-- Favicon: 16x16 blue PNG (base64) -->
<link rel="icon" type="image/png" sizes="16x16" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAIAAACQd1h4AAAACXBIWXMAAAsTAAALEwEAmpwYAAAAAXRSTlMAQObYZgAAAA1JREFUCBftwQENAAAAwjD7U4vhDlEUzwQ4lgAAAABJRU5ErkJggg==">
<style>
  :root{
  --bg:#fafafa;
  --fg:#111;
  --card:#fff;
  --border:#ddd;
  --accent:#d64045;
  --primary:#2a9d8f;
  --secondary:#ffe66d;
  --bg-dark:#2c3e50;
  --fg-dark:#ecf0f1;
  --card-dark:#34495e;
  --border-dark:#3a5b6e;
}
  body{font-family:sans-serif;margin:2rem;background:var(--bg);color:var(--fg);padding:10px;box-sizing:border-box;transition:background .3s,color .3s;}
  html.dark body{background:var(--bg-dark);color:var(--fg-dark);}
  html.dark .card{background:var(--card-dark);border-color:var(--border-dark);}
  html.dark input{color:#111;}
  .ver{font-size:10px;color:#999;margin-top:30px;}
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:20px;
    box-shadow:0 2px 4px rgba(0,0,0,.1);
    transition:transform .2s, box-shadow .2s;
  }
  .card:hover{transform:translateY(-2px);box-shadow:0 6px 12px rgba(0,0,0,.15);}
  .card[data-loaded="true"]{animation:cardIn .5s ease forwards;}
  @keyframes cardIn{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
  .calc-form label{font-weight:600;color:#555;}
  .calc-form input{padding:.6rem;border:2px solid #dfe6e9;border-radius:8px;background:#fff;}
  button{padding:.6rem 1rem;margin-top:1rem;border:none;border-radius:.5rem;font-weight:600;cursor:pointer;transition:transform .2s,box-shadow .2s;}
  button.go{background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;}
  button.go:hover{transform:translateY(-2px);box-shadow:0 0 12px rgba(42,157,143,.4);}
  button.go:active{transform:translateY(1px);}
  button.moon{background:none;border:none;font-size:20px;cursor:pointer;position:absolute;top:10px;right:10px;color:var(--muted);}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important;}}
</style>
</head>
<body>
<h1>Biorhythm</h1>
<button class="moon" aria-label="Toggle dark mode">🌙</button>
<div class="card">
<form class="calc-form" id="bform">
<label>Birth date: <input type="date" id="birth" required></label><br><br>
<label>Days to show: <input type="number" id="range" min="1" value="90"></label><br><br>
<button type="submit" class="go">Go</button>
</form>
<p id="result"></p>
<p><button id="share" class="go" style="display:none;">🔗 Share my result</button></p>
</div>
<p class="ver">PAGE VER 2025-10-14 - live</p>
<script>
/* dark mode */
(function(){
  const html = document.documentElement;
  const moon = document.querySelector('.moon');
  if(window.matchMedia('(prefers-color-scheme: dark)').matches) html.classList.add('dark');
  if(moon) moon.addEventListener('click',()=>{ html.classList.toggle('dark'); });
})();
/* biorhythm */
function daysSinceBirth(bd){const today=new Date();const birth=new Date(bd);return Math.floor(Math.abs(today-birth)/(1000*60*60*24));}
function sinCycle(d,p){return Math.sin(2*Math.PI*d/p);}
document.getElementById('bform').addEventListener('submit',function(e){
  e.preventDefault();
  const birth=document.getElementById('birth').value;
  const range=document.getElementById('range').value||90;
  if(!birth){alert('Enter a birth date');return;}
  const offset=daysSinceBirth(birth);
  function pct(v){return Math.round(((Math.sin(2*Math.PI*v)+1)/2)*100);}
  const phys=pct(offset/23);
  const emo=pct(offset/28);
  const intel=pct(offset/33);
    document.getElementById('result').textContent='Physical '+phys+'% Emotional '+emo+'% Intellectual '+intel+'%';
  const shareBtn=document.getElementById('share');
  if(shareBtn){
    shareBtn.style.display='inline-block';
    shareBtn.onclick=()=>{
      const txt='My biorhythm – Physical '+phys+'% Emotional '+emo+'% Intellectual '+intel+'% #biorhythm';
      const url=window.location.href;
      window.open('https://twitter.com/intent/tweet?text='+encodeURIComponent(txt)+'&url='+encodeURIComponent(url),'_blank');
    };
  }
});
</script>
<script>
/* entrance: animate the card once the page is parsed */
document.addEventListener('DOMContentLoaded', () => {
  const card = document.querySelector('.card');
  if (card) card.setAttribute('data-loaded', 'true');
});
</script>
</body>
</html>
