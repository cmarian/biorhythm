<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Biorhythm – test</title>
</head>
<body>
<h1>Biorhythm</h1>
<form>
  <label for="birth">Birth date:</label>
  <input type="date" id="birth" name="birth">
  <br><br>
  <label for="range">Days to show:</label>
  <input type="number" id="range" name="range" min="1" value="90">
  <br><br>
  <button type="submit">Go</button>
</form>
<p>Result will appear here: <span id="result"></span></p>
<footer>
  &copy; 2026 test biorhythm
</footer>
<script>
document.querySelector('form').addEventListener('submit',function(e){
  e.preventDefault();
  const birth=document.getElementById('birth').value;
  const range=document.getElementById('range').value||90;
  document.getElementById('result').textContent='Submitted birth='+birth+' range='+range;
});
</script>
</body>
</html>
