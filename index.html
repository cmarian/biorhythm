<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Biorhythm</title>

<!--  Google font (soft, rounded)  -->
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600&display=swap"
      rel="stylesheet">

<!--  Chart.js (for the sine‑wave graph)  -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0"></script>

<!--  Inline styles & script – keep everything in one file  -->
<style>
  :root{
    /*  Pastel palette – easy on the eyes  */
    --bg-start:#fdfdfe;
    --bg-end:#e0e7ff;
    --card-bg:rgba(255,255,255,.85);
    --text:#2c3e50;
    --primary:#7eccab;      /* teal‑green accent */
    --secondary:#ff6b6b;    /* gentle coral */
    --accent:#ffe66d;       /* soft sunshine yellow */
  }

  body{
    margin:0;
    font-family:'Montserrat',sans-serif;
    background:linear-gradient(135deg,var(--bg-start),var(--bg-end));
    color:var(--text);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  /*  Card – no overflow that clips the date‑picker  */
  .card{
    width:92%;
    max-width:620px;
    background:var(--card-bg);
    padding:2.5rem 2rem;
    border-radius:20px;
    box-shadow:0 20px 40px rgba(0,0,0,.1);
    position:relative;
    overflow:visible;               /*  let the date‑dropdown breathe  */
  }

  /*  Faint coloured overlay – keeps the “artistic” feel  */
  .card::before{
    content:'';
    position:absolute;
    inset:0;
    background:linear-gradient(135deg,var(--primary),var(--secondary));
    opacity:.07;
    border-radius:20px;
  }

  .card-header{
    text-align:center;margin-bottom:1.5rem;
  }
  .card-header h1{
    margin:0;font-size:1.8rem;color:var(--primary);
  }
  .card-header .sub{
    font-size:.9rem;color:#666;margin-top:.3rem;
  }

  /*  ====  FORM ====  */
  .form-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap .8rem;margin-bottom:.8rem;
  }
  .form-group label{
    display:block;margin-bottom:.3rem;font-weight:600;color:#555;
  }
  .form-group input{
    width:100%;padding:.6rem .8rem;border:2px solid #dfe6e9;
    border-radius:10px;background:#fafafa;color:var(--text);
    font-family:'Montserrat',sans-serif;font-size:1rem;outline:none;
    appearance:none;                 /*  strip default arrow, we keep the calendar via type="date"  */
    z-index:2;                       /*  above the card’s pseudo‑element  */
  }
  .form-group input:focus{
    border-color:var(--primary);
    background:#f4faff;
  }

  /*  ====  CALCULATE BUTTON ====  */
  .calc-btn{
    width:100%;padding:.8rem;margin-top:.4rem;
    background:linear-gradient(135deg,var(--primary),var(--secondary));
    color:#fff;border:none;border-radius:10px;
    font-family:'Montserrat',sans-serif;font-size:1rem;font-weight:600;
    letter-spacing:1px;cursor:pointer;transition:transform .2s,box-shadow .2s;
  }
  .calc-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 0 20px rgba(126,204,171,.4);
  }
  .calc-btn:active{transform:translateY(1px);}

  /*  ====  RESULT TILES ====  */
  .result-tiles{
    margin-top:1.5rem;display:grid;grid-template-columns:1fr 1fr 1fr;
    gap .5rem;}
  .tile{
    background:rgba(255,255,255,.7);
    border-radius:12px;padding:.8rem 0.6rem;
    text-align:center;min-height:80px;display:flex;
    flex-direction:column;justify-content:center;}
  .tile i{font-size:2rem;margin-bottom:.3rem;}
  .tile .pct{font-size:1.4rem;font-weight:600;color:var(--primary);}
  .tile .name{font-size:.85rem;color:#777;margin-top:.1rem;}

  /*  Chart canvas  */
  .chart-wrapper{margin-top:2rem;position:relative;}
  canvas{display:block;margin:0 auto;}

  /*  Accessibility – reduce motion  */
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms!important;transition-duration:.01ms!important;}
  }
</style>
</head>
<body>

  <main class="card">
    <header class="card-header">
      <h1><i class="fas fa‑gem"></i> Biorhythm</h1>
      <p class="sub">Physical • Emotional • Intellectual</p>
    </header>

    <section class="card-body">
      <form id="biorhythm-form">
        <div class="form-row">
          <div class="form-group">
            <label for="birthdate"><i class="fas fa‑calendar‑alt"></i> Birth date</label>
            <!--  Native date picker – works with mouse & keyboard  -->
            <input type="date"
                   id="birthdate"
                   required
                   style="
                     width:100%;
                     padding:.6rem .8rem;
                     border:2px solid #dfe6e9;
                     border-radius:.5rem;
                     background:#fafafa;
                     color:#2c3e50;
                     font-family:inherit;
                     font-size:1rem;
                     outline:none;
                     z-index:1;
                     appearance:none;
                   ">
          </div>

          <div class="form-group">
            <label for="range"><i class="fas fa‑slider"></i> Days to show</label>
            <input type="number"
                   id="range"
                   min="1"
                   value="90"
                   style="
                     width:100%;
                     padding:.6rem .8rem;
                     border:2px solid #dfe6e9;
                     border-radius:.5rem;
                     background:#fafafa;
                     color:#2c3e50;
                     font-family:inherit;
                     font-size:1rem;
                     outline:none;
                     appearance:none;
                   ">
          </div>
        </div>

        <button type="submit" class="calc-btn"><i class="fas fa‑calculate"></i> GO</button>
      </form>
    </section>

    <!--  Result tiles (appear after “GO”)  -->
    <div id="result" class="result-tiles"></div>

    <!--  Chart canvas – the “star” of the page  -->
    <section class="chart-wrapper">
      <canvas id="biorhythmChart"></canvas>
    </section>
  </main>

  <script>
    /*  ====  Biorhythm CALCULATION  ==== */
    function sinCycle(days, period){
      return Math.sin((2*Math.PI*days)/period);
    }
    function daysSinceBirth(birthDate){
      const today=new Date();
      const birth=new Date(birthDate);
      const diff=Math.abs(today-birth);
      return Math.floor(diff/(1000*60*60*24));
    }
    function computeCycles(birthDate,rangeDays){
      const offset=daysSinceBirth(birthDate);
      const data=[];
      for(let i=-rangeDays;i<=rangeDays;i++){
        const day=offset+i;
        data.push({
          day,
          physical:sinCycle(day,23),
          emotional:sinCycle(day,28),
          intellectual:sinCycle(day,33)
        });
      }
      return data;
    }
    function pct(value){                // map sine (‑1…+1) → 0‑100 %
      return Math.round(((value+1)/2)*100);
    }

    /*  ====  CHART.JS RENDERER  ==== */
    function renderChart(data){
      const ctx=document.getElementById('biorhythmChart').getContext('2d');
      const days=data.map(d=>d.day);
      const phys=data.map(d=>d.physical);
      const emo =data.map(d=>d.emotional);
      const intel=data.map(d=>d.intellectual);

      const min=Math.min(...phys,emo,intel)-0.2;
      const max=Math.max(...phys,emo,intel)+0.2;

      new Chart(ctx,{
        type:'line',
        data:{
          labels:days,
          datasets:[
            {
              label:'Physical (23 d)',
              data:phys,
              borderColor:'#7eccab',
              backgroundColor:'rgba(126,204,171,0.15)',
              tension:0.3,
              fill:true
            },
            {
              label:'Emotional (28 d)',
              data:emo,
              borderColor:'#ff6b6b',
              backgroundColor:'rgba(251,107,107,0.15)',
              tension:0.3,
              fill:true
            },
            {
              label:'Intellectual (33 d)',
              data:intel,
              borderColor:'#ffe66d',
              backgroundColor:'rgba(255,230,109,0.15)',
              tension:0.3,
              fill:true
            }
          ]
        },
        options:{
          responsive:true,
          maintainAspectRatio:false,
          hover:{mode:'index'},
          scales:{
            y:{min,max,display:true,
               title:{display:true,text:'Value'},
               ticks:{stepSize:0.2}},
            x:{title:{display:true,text:'Days relative to today'}}
          },
          plugins:{
            title:{
              display:true,
              text:'Biorhythm Cycles',
              font:{size:16}}
          }
        }
      });
    }

    /*  ====  UI HANDLER – form submit  ==== */
    document.getElementById('biorhythm-form').addEventListener('submit',e=>{
      e.preventDefault();

      const birth=document.getElementById('birthdate').value.trim();
      const range=parseInt(document.getElementById('range').value,10)||90;

      if(!birth||!/^\d{4}-\d{2}-\d{2}$/.test(birth)){
        alert('Enter a valid date in YYYY‑MM‑DD format.');
        return;
      }
      if(range<1){
        alert('Days to show must be at least 1.');
        return;
      }

      const cycles=computeCycles(birth,range);

      // “today” is the row where day===0
      const today=cycles.find(d=>d.day===0)||cycles[0];

      // ----  Fill the three tiles  ----
      const out=document.getElementById('result');
      out.innerHTML=`
        <div class="tile"><div class="pct">${pct(today.physical)}%</div>Physical</div>
        <div class="tile"><div class="pct">${pct(today.emotional)}%</div>Emotional</div>
        <div class="tile"><div class="pct">${pct(today.intellectual)}%</div>Intellectual</div>
      `;

      // ----  Draw the sine‑wave chart  ----
      renderChart(cycles);
    });
  </script>
</body>
</html>
