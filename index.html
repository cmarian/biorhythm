<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Biorhythm – live</title>
<!-- favicon & apple touch icon (data URIs, no external files) -->
<link rel="icon" type="image/svg+xml" data="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23d64045'/%3E%3Ctext x='16' y='20' font-family='sans-serif' font-size='12' fill='%23fff' text-anchor='middle'%3EB%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" sizes="180x180" href="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='180' height='180' viewBox='0 0 180 180'%3E%3Ccircle cx='90' cy='90' r='85' fill='%23d64045'/%3E%3Ctext x='90' y='105' font-family='sans-serif' font-size='24' fill='%23fff' text-anchor='middle'%3EB%3C/text%3E%3C/svg%3E">
<style>
  /* ---- root variables & base reset ---- */
  :root{
    --bg:#fdfdfd;
    --fg:#111;
    --muted:#666;
    --accent:#d64045;
    --soft:#ffe66d;
    --card:#fff;
    --border:#e0e0e0;
    --primary:#2a9d8f;
    --secondary:#ffe66d;
    --bg-dark:#2c3e50;
    --fg-dark:#ecf0f1;
    --card-dark:#34495e;
    --border-dark:#2c3e50;
  }
  html.dark{
    --bg:#2c3e50;
    --fg:#ecf0f1;
    --muted:#bdc3c7;
    --accent:#ff7b5b;
    --soft:#f5b64e;
    --card:#34495e;
    --border:#2c3e50;
    --primary:#1abc9c;
    --secondary:#f5b64e;
  }
  body{
    font-family:sans-serif;
    max-width:600px;
    margin:2rem auto;
    line-height:1.5;
    background:var(--bg);
    color:var(--fg);
    transition:background .4s ease;
  }
  html.dark body{
    background:var(--bg-dark);
    color:var(--fg-dark);
  }
  /* ---- glass card ---- */
  .card{
    background:rgba(var(--card), .85);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    border:1px solid var(--border);
    border-radius:12px;
    padding:2rem;
    box-shadow:0 2px 4px rgba(0,0,0,.1);
    transition:transform .2s, box-shadow .2s;
  }
  .card:hover{
    transform:translateY(-2px);
    box-shadow:0 6px 12px rgba(0,0,0,.15);
  }
  /* ---- moon button ---- */
  button.moon{
    position:absolute;top:1rem;right:1rem;
    background:none;border:none;color:var(--muted);font-size:1.2rem;cursor:pointer;
    aria-label="Toggle dark mode";
  }
  /* moon pulse animation */
  @keyframes pulse{
    0%   { transform: scale(1); }
    50%  { transform: scale(1.15); }
    100% { transform: scale(1); }
  }
  button.moon.pulsed{
    animation:pulse .4s ease;
  }
  /* ---- entrance fade-in ---- */
  @keyframes fadeIn{
    from{opacity:0; transform:translateY(12px);}
    to {opacity:1; transform:translateY(0);}
  }
  .card.loaded{
    animation:fadeIn .5s ease forwards;
  }
  /* ---- form elements ---- */
  h1{margin:0 .5rem 0;}
  form{margin-top:1rem;}
  input{width:100%;padding:.5rem;border:1px solid #ddd;border-radius:.4rem;margin:.5rem 0;}
  button{padding:.5rem 1rem;margin-top:1rem;background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;border:none;border-radius:.5rem;font-weight:600;}
  button:hover{box-shadow:0 0 12px rgba(42,157,143,.4);}
  /* ---- result paragraph ---- */
  .result{margin-top:1rem;font-size:1.1rem;}
  /* ---- version marker ---- */
  .version{font-size:.8rem;color:#999;margin-top:1rem;}
</style>
</head>
<body>

<!-- version marker – proves the new HTML is live -->
<p class="version">Version: 2025‑10‑12 (live)</p>

<header>
<h1>Biorhythm</h1>
<button class="moon" aria-label="Toggle dark mode">🌙</button>
</header>

<div class="card">
<form id="bform">
<label>Birth date: <input type="date" id="birth" required></label><br><br>
<label>Days to show: <input type="number" id="range" min="1" value="90"></label><br><br>
<button type="submit">Go</button>
</form>
<p id="result" class="result"></p>
</div>

<footer>
&copy; 2026 biorhythm – entertainment only
</footer>

<script>
/* ---- dark‑mode toggle ---- */
(function(){
  const html = document.documentElement;
  const moon = document.querySelector('.moon');
  if(window.matchMedia('(prefers-color-scheme: dark)').matches){
    html.classList.add('dark');
  }
  if(moon){
    moon.addEventListener('click',()=>{
      html.classList.toggle('dark');
      localStorage.setItem('theme',html.classList.contains('dark')?'dark':'light');
      moon.classList.toggle('pulsed');   // visual feedback
    });
  }
})();
</script>

<script>
/* ---- biorhythm calculation ---- */
function daysSinceBirth(birthDate){
  const today = new Date();
  const birth = new Date(birthDate);
  return Math.floor(Math.abs(today - birth) / (1000 * 60 * 60 * 24));
}
function sinCycle(days, period){
  return Math.sin(2 * Math.PI * days / period);
}
function computeCycles(birthDate, rangeDays){
  const offset = daysSinceBirth(birthDate);
  const data = [];
  for (let i = -rangeDays; i <= rangeDays; i++) {
    const day = offset + i;
    data.push({
      day,
      physical: sinCycle(day, 23),
      emotional: sinCycle(day, 28),
      intellectual: sinCycle(day, 33)
    });
  }
  return data;
}
function pct(value){
  return Math.round(((value + 1) / 2) * 100);
}

/* ---- form submit handler ---- */
document.getElementById('bform').addEventListener('submit', function(e){
  e.preventDefault();
  const birth = document.getElementById('birth').value;
  const range = document.getElementById('range').value || 90;
  if (!birth) { alert('Enter a birth date'); return; }
  const cycles = computeCycles(birth, range);
  const today = cycles.find(d => d.day === 0) || cycles[0];
  const pPhysical = pct(today.physical);
  const pEmotional = pct(today.emotional);
  const pIntellectual = pct(today.intellectual);
  document.getElementById('result').textContent =
    'Physical ' + pPhysical + '% Emotional ' + pEmotional + '% Intellectual ' + pIntellectual + '%';
});
</script>

<script>
/* ---- fade‑in the card after DOM is ready ---- */
document.addEventListener('DOMContentLoaded', () => {
  const card = document.querySelector('.card');
  if (card) card.classList.add('loaded');
});
</script>
</body>
</html>
