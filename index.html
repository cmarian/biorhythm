<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Biorhythm – simple</title>
<!-- Favicon: 16x16 blue PNG (base64) -->
<link rel="icon" type="image/png" sizes="16x16" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAIAAACQd1h4AAAACXBIWXMAAAsTAAALEwEAmpwYAAAAAXRSTlMAQObYZgAAAA1JREFUCBftwQENAAAAwjD7U4vhDlEUzwQ4lgAAAABJRU5ErkJggg==">
<style>
  :root{
  --bg:#fafafa;
  --fg:#111;
  --card:#fff;
  --border:#ddd;
  --bg-dark:#2c3e50;
  --fg-dark:#ecf0f1;
  --card-dark:#34495e;
  --border-dark:#3a5b6e;
}
  body{font-family:sans-serif;margin:2rem;background:var(--bg);color:var(--fg);padding:10px;box-sizing:border-box;transition:background .3s,color .3s;}
  html.dark body{background:var(--bg-dark);color:var(--fg-dark);}
  html.dark .card{background:var(--card-dark);border-color:var(--border-dark);}
  html.dark input{color:#111;}
  .ver{font-size:10px;color:#ff0000;margin-top:30px;border:1px solid red;padding:5px;}
  .card{background:#fff;padding:20px;border:1px solid #ddd;border-radius:8px}
  button.moon{background:none;border:none;font-size:20px;cursor:pointer;position:absolute;top:10px;right:10px;}
</style>
</head>
<body>
<h1>Biorhythm</h1>
<button class="moon" aria-label="Toggle dark mode">🌙</button>
<div class="card">
<form id="bform">
<label>Birth date: <input type="date" id="birth" required></label><br><br>
<label>Days to show: <input type="number" id="range" min="1" value="90"></label><br><br>
<button type="submit">Go</button>
</form>
<p id="result"></p>
</div>
<p class="ver">PAGE VER 2025-10-14 - live</p>
<script>
/* dark mode */
(function(){
  const html = document.documentElement;
  const moon = document.querySelector('.moon');
  if(window.matchMedia('(prefers-color-scheme: dark)').matches) html.classList.add('dark');
  if(moon) moon.addEventListener('click',()=>{ html.classList.toggle('dark'); });
})();
/* biorhythm */
function daysSinceBirth(bd){const today=new Date();const birth=new Date(bd);return Math.floor(Math.abs(today-birth)/(1000*60*60*24));}
function sinCycle(d,p){return Math.sin(2*Math.PI*d/p);}
document.getElementById('bform').addEventListener('submit',function(e){
  e.preventDefault();
  const birth=document.getElementById('birth').value;
  const range=document.getElementById('range').value||90;
  if(!birth){alert('Enter a birth date');return;}
  const offset=daysSinceBirth(birth);
  function pct(v){return Math.round(((Math.sin(2*Math.PI*v)+1)/2)*100);}
  const phys=pct(offset/23);
  const emo=pct(offset/28);
  const intel=pct(offset/33);
  document.getElementById('result').textContent='Physical '+phys+'% Emotional '+emo+'% Intellectual '+intel+'%';
});
</script>
</body>
</html>
