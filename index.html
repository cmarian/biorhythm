<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Biorhythm ⋆⋆</title>

  <!--  Google‑font (fun & round)  -->
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700&display=swap"
        rel="stylesheet">

  <!--  Font‑Awesome for tiny icons  -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!--  ====  CENTERED CARD ==== -->
  <main class="card">
    <header class="card-header">
      <h1><i class="fas fa‑smile-wink"></i> Biorhythm</h1>
      <p class="card-sub">Your day‑by‑day colour‑coded vibe</p>
    </header>

    <section class="card-body">
      <form id="biorhythm-form">
        <div class="form-row">
          <div class="form-group">
            <label for="birthdate"><i class="fas fa‑calendar-day"></i> Birth date</label>
            <input type="date" id="birthdate" required>
          </div>

          <div class="form-group">
            <label for="range"><i class="fas fa‑slider-horizontal"></i> Days to show</label>
            <input type="number" id="range" min="1" value="60">
          </div>
        </div>

        <button type="submit" class="calc-btn"><i class="fas fa‑calculate"></i> GO!</button>
      </form>
    </section>

    <!--  Result area – three big tiles  -->
    <div id="result" class="result-tiles"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
